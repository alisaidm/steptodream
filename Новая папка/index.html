<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Step to Dream — Qiziqishdan katta maqsadlar sari</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7ff;--card:#fff;--ink:#0b1f5c;--mute:#52608a;--blue:#1f5eff;--navy:#0b1f5c;--gold:#ffc425;--line:#dfe6fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070f2b;--card:#101b44;--ink:#eef2ff;--mute:#a9b6e0;--blue:#5b8cff;--navy:#0a1649;--line:#22305f}}
:root[data-theme="dark"]{--bg:#070f2b;--card:#101b44;--ink:#eef2ff;--mute:#a9b6e0;--blue:#5b8cff;--navy:#0a1649;--line:#22305f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,Segoe UI,Arial,sans-serif;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff}
.bar{max-width:1120px;margin:auto;display:flex;align-items:center;gap:16px;padding:12px 20px}
.logo{font-weight:800;letter-spacing:.04em;color:#fff;text-decoration:none;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--gold);display:inline-block}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav a{color:#c9d5ff;text-decoration:none;font-size:13px;font-weight:600;padding:7px 11px;border-radius:99px;white-space:nowrap}
nav a:hover{background:rgba(255,255,255,.12)}
nav a.on{background:var(--gold);color:#0b1f5c}
main{max-width:1120px;margin:auto;padding:0 20px 40px}
.hero{background:var(--navy);color:#fff;margin:0 -20px;padding:64px 20px 72px;position:relative;overflow:hidden}
.hero>div{max-width:1120px;margin:auto;position:relative}
.hero:after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:var(--blue);opacity:.35}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
h1{font-size:clamp(40px,8vw,84px);line-height:1;margin:14px 0;font-weight:800}
h1 em{font-style:normal;color:var(--gold)}
h2{font-size:clamp(28px,4.5vw,46px);line-height:1.1;margin:10px 0 14px;font-weight:800}
.lead{font-size:clamp(16px,2vw,20px);max-width:680px;color:var(--mute)}
.hero .lead{color:#c9d5ff}
.btn{display:inline-block;background:var(--gold);color:#0b1f5c;font-weight:800;text-decoration:none;padding:13px 22px;border-radius:12px;margin:22px 10px 0 0}
.btn.alt{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.4)}
.stat{display:inline-block;margin-top:26px;padding:14px 20px;border-radius:16px;background:rgba(255,255,255,.1)}
.stat b{font-size:48px;color:var(--gold);line-height:1;margin-right:10px}
.page-head{padding:44px 0 8px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin:26px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;position:relative}
.card .k{display:inline-grid;place-items:center;min-width:38px;height:38px;padding:0 10px;border-radius:11px;background:var(--blue);color:#fff;font-weight:800;font-size:14px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:18px}
.card p{margin:0;color:var(--mute);font-size:15px}
.card.big{background:var(--navy);color:#fff;border:0}
.card.big p{color:#c9d5ff}
.card.big .k{background:var(--gold);color:#0b1f5c}
.note{border-left:5px solid var(--gold);background:var(--card);border-radius:0 16px 16px 0;padding:18px 22px;font-weight:600;margin:10px 0 28px}
.pager{display:flex;justify-content:space-between;gap:12px;padding-top:18px;border-top:1px solid var(--line)}
.pager a{color:var(--blue);font-weight:800;text-decoration:none}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin:30px 0}
.tile{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;transition:.2s}
.tile:hover{transform:translateY(-4px);border-color:var(--blue)}
.tile small{color:var(--blue);font-weight:800;letter-spacing:.1em}
.tile b{display:block;margin:6px 0 4px;font-size:17px}
.tile span{color:var(--mute);font-size:14px}
.quote{font-size:clamp(22px,3.4vw,34px);font-weight:800;line-height:1.25;margin:20px 0}
footer{background:var(--navy);color:#9fb0e6;text-align:center;font-size:12px;letter-spacing:.12em;padding:22px;font-weight:600}
</style>
</head>
<body>
<header><div class="bar"><a class="logo" href="#bosh"><i></i>STEP TO DREAM</a><nav id="nav"></nav></div></header>
<main id="app"></main>
<footer>STEP TO DREAM • QIZIQISHDAN KATTA MAQSADLAR SARI</footer>
<script>
var P=[
{id:"muammo",n:"01",t:"Muammo",h:"Men muammoni maktablarning o‘zida ko‘rdim",l:"Bu loyiha taxminlardan emas, kuzatuv va tajribadan boshlandi.",
 big:[["62","Tumanimizdagi 75 ta maktabdan 62 tasiga borib, o‘quvchilar bilan uchrashdim."]],
 c:[["!","Bir xil holat","Ba’zi o‘quvchilar taqdimot va nasihatlarga qiziqmay, chetda qolishdi."],["?","Asosiy savol","Qanday qilib bolaga shunchaki “o‘qi” demasdan, o‘qishga qiziqish uyg‘otamiz?"]],
 note:"Xulosa: bolalarga yana bir ma’ruza emas — o‘zlari qatnashadigan, qiziqarli va xavfsiz muhit kerak."},
{id:"goya",n:"02",t:"G‘oya",h:"Avval qiziqish. Keyin bilim. So‘ng katta orzular.",l:"Step to Dream — o‘quvchini majburlash emas, uni o‘rganishga o‘zi intiladigan muhitga olib kirish.",
 c:[["01","Qiziqish","O‘yin, savol, kashfiyot"],["02","Ishonch","Fikr bildirish, sinab ko‘rish"],["03","Imkoniyat","Bilim, maqsad, kelajak"]],
 note:"Biz bolaga tayyor javob bermaymiz. Unga savol berish, izlanish va o‘z yo‘lini topish imkonini beramiz."},
{id:"kimlar",n:"03",t:"Kimlar uchun?",h:"Kichik yoshdan katta dunyoqarash sari",l:"Birinchi bosqichda 6–7-sinf o‘quvchilariga e’tibor qaratamiz.",
 c:[["?","Kimlar?","6–7-sinf o‘quvchilari. Ayniqsa, o‘qishga hali qiziqishi uyg‘onmagan yoki o‘ziga ishonchi past bolalar."],["📍","Qayerda?","Maktablarning o‘zida kichik Step to Dream klublari. O‘quvchi o‘z maktabida qatnasha oladi."],["★","Qanday muhit?","Do‘stona, faol, xato qilishdan qo‘rqmaydigan, hamma fikri qadrlanadigan muhit."]],
 note:"Asosiy tamoyil: “Seni qiziqtirgan narsadan boshlaymiz — keyin uni bilim bilan bog‘laymiz.”"},
{id:"klub",n:"04",t:"Klub qanday ishlaydi?",h:"Dars emas — ishtirok, tajriba va kashfiyot",l:"Har bir uchrashuv qisqa, jonli va o‘quvchini faol qatnashtiradigan formatda bo‘ladi.",
 c:[["1","Icebreaker","Qiziqarli savol yoki jamoaviy tanishuv"],["2","Discover","O‘zbekiston yoki dunyodagi mavzuni kashf etish"],["3","Play & Create","O‘yin, muammo yechish yoki kichik loyiha"],["4","Share","Guruhlar fikrini taqdim etadi va muhokama qiladi"]],
 note:"Har bir bola tomoshabin emas, jarayonning bir qismi bo‘ladi."},
{id:"oyinlar",n:"05",t:"Interaktiv o‘yinlar",h:"O‘qishga qiziqish uyg‘otadigan 3 ta o‘yin",l:"O‘yinlar shunchaki vaqt o‘tkazish uchun emas — fikrlash, muloqot va bilimni mashq qilish uchun.",
 c:[["01","World in 60 Seconds","Jamoalar biror davlat yoki global yangilikni 60 soniyada tushuntiradi. Geografiya, izlanish va nutq ko‘nikmasi rivojlanadi."],["02","Debate: Agree / Disagree","Qiziqarli savol beriladi. O‘quvchilar “roziman” yoki “qarshiman” pozitsiyasini tanlab, sabablarini aytadi. Har bir fikr hurmat qilinadi."],["03","Dream Quest","Jamoalar topshiriq kartalarini bajarib, bir muammoning yechimini topadi va mini-taqdimot qiladi. Hamkorlik va ijodkorlik kuchayadi."]],
 note:"Qo‘shimcha formatlar: quiz, role-play, “topib ko‘r”, mini-debat va jamoaviy challenge."},
{id:"global",n:"06",t:"Global perspective",h:"Dunyo bilan tanish — o‘z imkoniyatingni angla",l:"O‘quvchilar O‘zbekistondagi va dunyodagi voqealarni yoshiga mos, sodda va ishonchli manbalar orqali o‘rganadi.",
 c:[["🌍","World Update","Haftaning muhim xalqaro yangiliklari: fan, texnologiya, ekologiya, sport va madaniyat."],["🇺🇿","Uzbekistan Now","O‘zbekistondagi yangi imkoniyatlar, yoshlar tashabbuslari, ilm-fan va ijobiy o‘zgarishlar."],["✦","Global Perspective","Turli mamlakatlar, madaniyatlar va muammolarga boshqa nuqtai nazardan qarash; “men ham qila olaman” fikrini shakllantirish."]],
 note:"Maqsad: o‘quvchi o‘z hududidan uzoqqa qaramay qolmasin — dunyoda nimalar bo‘layotganini bilsin va o‘z salohiyatini ko‘rsin."},
{id:"konikmalar",n:"07",t:"Ko‘nikmalar",h:"Bir klub — hayot uchun kerakli ko‘nikmalar",l:"Ta’limni faqat darslik bilan cheklamaymiz; bolalar o‘rganganini amalda qo‘llaydi.",
 c:[["💬","Debate","Fikrni asoslash va tinglash"],["🎤","Presentation","Ommada gapirish va taqdimot"],["🤝","Teamwork","Jamoada ishlash va yetakchilik"],["🧠","Critical thinking","Savol berish va tahlil qilish"],["💡","Creativity","Yangi g‘oya va yechimlar"],["🔭","Curiosity","Mustaqil izlanish va o‘rganish"]],
 note:"Har bir mashg‘ulot oxirida o‘quvchi: “Bugun nimani bildim va nimani sinab ko‘raman?” degan savolga javob beradi."},
{id:"format",n:"08",t:"Haftalik format",h:"Muntazam, lekin zeriktirmaydigan ritm",l:"Dastlab haftasiga 2 marta. Zarurat va maktab jadvaliga qarab 3-uchrashuv ixtiyoriy bo‘lishi mumkin.",
 c:[["1","1-uchrashuv · Global & Discover","Yangilik, qiziqarli mavzu, savol-javob va kichik tadqiqot."],["2","2-uchrashuv · Play & Practice","O‘yin, debat, jamoaviy vazifa va mini-taqdimot."],["3","3-uchrashuv · Special Session (ixtiyoriy)","Mehmon bilan suhbat, loyiha kuni, quiz yoki ijodiy challenge."]],
 note:"Har bir uchrashuv taxminan 45–60 daqiqa. Dars jadvali va o‘quvchilarning yuklamasiga moslashtiriladi."},
{id:"amalga",n:"09",t:"Amalga oshirish",h:"Kichik boshlaymiz. Natijaga qarab kengaytiramiz.",l:"Tumanimizdagi 75 ta maktabni qamrab olish — uzoq muddatli maqsad. Avval sinov, keyin kengayish.",
 c:[["1","Pilot","5 ta maktabda klubni sinovdan o‘tkazish"],["2","Takomillashtirish","O‘quvchi fikri va qatnashuvga qarab formatni yaxshilash"],["3","Kengaytirish","Keyingi bosqichda 62 ta maktab tajribasiga tayangan holda ko‘lamni oshirish"],["4","75 maktab","Tuman bo‘ylab barqaror klub tarmog‘ini shakllantirish"]]},
{id:"natija",n:"10",t:"Natijani o‘lchash",h:"Muvaffaqiyatni faqat qatnashchilar soni bilan o‘lchamaymiz",l:"Biz uchun eng muhim o‘zgarish — o‘quvchining qiziqishi va faolligi oshishi.",
 c:[["1","Qatnashuv","Klubga muntazam kelayotgan o‘quvchilar"],["2","Faollik","O‘yin, debat va muhokamalarda ishtirok"],["3","Ishonch","Taqdimot qilishga va fikr bildirishga tayyorlik"],["4","Qiziqish","Mustaqil savol berish va yangi mavzuni izlash"]],
 note:"Pilot yakunida so‘rovnomalar, qatnashuv qaydlari, mini-taqdimotlar va o‘quvchi ishlari portfeli orqali natijani baholaymiz."}
];
var app=document.getElementById("app"),nav=document.getElementById("nav");
nav.innerHTML='<a href="#bosh" data-i="bosh">Bosh sahifa</a>'+P.map(function(p){return '<a href="#'+p.id+'" data-i="'+p.id+'">'+p.t+'</a>'}).join("");
function home(){
 return '<section class="hero"><div><span class="tag">A school club movement</span><h1>STEP TO <em>DREAM</em></h1><p class="lead" style="font-size:22px;font-weight:600;color:#fff">Qiziqishdan boshlanadi. Kelajak sari yetaklaydi.</p><p class="lead">6–7-sinf o‘quvchilari uchun interaktiv ta’lim klublari. Har bir bola o‘z imkoniyatini kashf etishga haqli.</p><div class="stat"><b>75</b>maktab — katta imkoniyat</div><br><a class="btn" href="#muammo">Muammodan boshlash →</a><a class="btn alt" href="#amalga">Reja</a></div></section>'+
 '<div class="tiles">'+P.map(function(p){return '<a class="tile" href="#'+p.id+'"><small>'+p.n+'</small><b>'+p.t+'</b><span>'+p.h+'</span></a>'}).join("")+'</div>'+
 '<div class="quote">Bir bolaning qiziqishi — uning kelajagiga ochilgan eshik.</div><p class="lead">Men har bir o‘quvchiga shuni ko‘rsatmoqchiman: qayerda tug‘ilganing yoki qaysi maktabda o‘qishing orzularing chegarasi emas. Sen ham izlanishing, o‘rganishing va katta maqsadlarga erishishing mumkin.</p><p class="lead">Keling, bolalarga faqat “o‘qi” demaylik. Ularga o‘rganishni sevib qolishlari uchun sabab beraylik.</p>';
}
function page(i){
 var p=P[i],pv=P[i-1],nx=P[i+1];
 var big=(p.big||[]).map(function(b){return '<div class="card big"><div class="k" style="font-size:34px;height:auto;background:none;color:var(--gold);padding:0">'+b[0]+' TA MAKTAB</div><p>'+b[1]+'</p></div>'}).join("");
 var cards=p.c.map(function(c){return '<div class="card"><span class="k">'+c[0]+'</span><h3>'+c[1]+'</h3><p>'+c[2]+'</p></div>'}).join("");
 return '<div class="page-head"><span class="tag" style="color:var(--blue)">'+p.n+' • '+p.t+'</span><h2>'+p.h+'</h2><p class="lead">'+p.l+'</p></div><div class="grid">'+big+cards+'</div>'+(p.note?'<div class="note">'+p.note+'</div>':'')+
 '<div class="pager"><a href="#'+(pv?pv.id:'bosh')+'">← '+(pv?pv.t:'Bosh sahifa')+'</a>'+(nx?'<a href="#'+nx.id+'">'+nx.t+' →</a>':'<a href="#bosh">Bosh sahifa →</a>')+'</div>';
}
function route(){
 var h=(location.hash||"#bosh").slice(1),i=P.findIndex(function(p){return p.id===h});
 if(i<0)h="bosh";
 app.innerHTML=i<0?home():page(i);
 [].forEach.call(nav.children,function(a){a.classList.toggle("on",a.dataset.i===h);if(a.dataset.i===h)a.scrollIntoView({inline:"center",block:"nearest"})});
 document.title=(i<0?"Step to Dream":P[i].t+" — Step to Dream");
 window.scrollTo(0,0);
}
addEventListener("hashchange",route);route();
</script>
</body>
</html>
